<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deepseek Harness</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f8fb;
        color: #1e293b;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          linear-gradient(180deg, #ffffff 0%, #f7f8fb 100%);
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        max-width: 34rem;
        padding: 3rem 2rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 2rem;
        line-height: 1.15;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        font-size: 1rem;
        line-height: 1.6;
        color: #475569;
      }

      .muted {
        margin-top: 0.75rem;
        font-size: 0.875rem;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="boot-title">Launching harness</h1>
      <p id="boot-body">Starting the bundled web profile.</p>
      <p class="muted">Deepseek Harness</p>
    </main>
  </body>
</html>
