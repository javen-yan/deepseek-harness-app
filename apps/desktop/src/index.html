    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --bg-2: #f4f7ff;
        --brand: #4d6bfe;
        --brand-2: #6b8aff;
        --brand-3: #b9c8ff;
        --ink: #0f1733;
        --ink-dim: #5b6786;
        --ink-faint: #98a3c4;
        --line: rgba(77, 107, 254, 0.1);
        --mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
        --sans: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        font-family: var(--sans);
        color: var(--ink);
        background: radial-gradient(120% 90% at 50% -10%, #eaf0ff 0%, var(--bg-2) 40%, var(--bg) 100%);
        overflow: hidden;
        display: grid;
        place-items: center;
        -webkit-font-smoothing: antialiased;
      }

      /* ---------- background layers ---------- */

      .bg {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .bg-grid {
        position: absolute;
        inset: -40%;
        background-image:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 52px 52px;
        transform: perspective(600px) rotateX(52deg) translateY(8%);
        transform-origin: center top;
        animation: grid-pan 26s linear infinite;
        opacity: 0.9;
        mask-image: radial-gradient(70% 60% at 50% 42%, #000 0%, transparent 78%);
        -webkit-mask-image: radial-gradient(70% 60% at 50% 42%, #000 0%, transparent 78%);
      }

      @keyframes grid-pan {
        from { background-position: 0 0, 0 0; }
        to { background-position: 0 52px, 0 0; }
      }

      .bg-aurora {
        position: absolute;
        left: 50%;
        top: 42%;
        width: 70vmax;
        height: 70vmax;
        transform: translate(-50%, -50%);
        background:
          radial-gradient(circle at 50% 50%, rgba(77, 107, 254, 0.12) 0%, rgba(77, 107, 254, 0.04) 36%, transparent 64%);
        animation: aurora-breathe 7s ease-in-out infinite;
      }

      @keyframes aurora-breathe {
        0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
        50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
      }

      .bg-scan {
        position: absolute;
        left: 0;
        right: 0;
        height: 140px;
        background: linear-gradient(180deg, transparent, rgba(77, 107, 254, 0.05), transparent);
        animation: scan 7s ease-in-out infinite;
      }

      @keyframes scan {
        0% { top: -20%; }
        55% { top: 108%; }
        100% { top: 108%; }
      }

      .particles {
        position: absolute;
        inset: 0;
      }

      .particle {
        position: absolute;
        left: var(--x);
        bottom: -12px;
        width: var(--s);
        height: var(--s);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(107, 138, 255, 0.75), transparent 70%);
        opacity: 0;
        animation: rise var(--d) linear infinite;
        animation-delay: var(--delay);
      }

      @keyframes rise {
        0% { transform: translateY(0) translateX(0); opacity: 0; }
        8% { opacity: 0.9; }
        80% { opacity: 0.5; }
        100% { transform: translateY(-110vh) translateX(var(--drift)); opacity: 0; }
      }

      /* ---------- layout ---------- */

      main {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2.4rem;
        padding: 3rem 2rem;
        text-align: center;
        max-width: 40rem;
      }

      /* ---------- orb / loader ---------- */

      .orb-wrap {
        position: relative;
        display: grid;
        justify-items: center;
      }

      .orb {
        position: relative;
        width: 190px;
        height: 190px;
        display: grid;
        place-items: center;
        animation: float 3.6s ease-in-out infinite;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-14px) rotate(-1.2deg); }
      }

      .ring {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
      }

      .ring-glow {
        inset: 8px;
        background: radial-gradient(circle, rgba(77, 107, 254, 0.16) 0%, rgba(77, 107, 254, 0.06) 45%, transparent 70%);
        filter: blur(2px);
        animation: glow-pulse 3.6s ease-in-out infinite;
      }

      @keyframes glow-pulse {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.06); }
      }

      .ring-dash {
        inset: 0;
        border: 1px dashed rgba(77, 107, 254, 0.26);
        animation: spin 26s linear infinite;
      }

      .ring-dash-2 {
        inset: -16px;
        border: 1px dashed rgba(77, 107, 254, 0.13);
        animation: spin 40s linear infinite reverse;
      }

      .ring-orbit {
        inset: -28px;
        animation: spin 9s linear infinite;
      }

      .ring-orbit .dot {
        position: absolute;
        top: 0;
        left: 50%;
        width: 7px;
        height: 7px;
        margin: -3.5px;
        border-radius: 50%;
        background: var(--brand-2);
        box-shadow: 0 0 10px 2px rgba(77, 107, 254, 0.45);
      }

      .ring-orbit .dot-2 {
        top: auto;
        bottom: 0;
        left: 50%;
        width: 4px;
        height: 4px;
        margin: -2px;
        background: var(--brand-2);
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .scanner {
        position: absolute;
        inset: 2px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0deg, rgba(77, 107, 254, 0.2) 40deg, transparent 90deg);
        animation: spin 4.5s linear infinite;
        -webkit-mask-image: radial-gradient(circle, transparent 62%, #000 63%);
        mask-image: radial-gradient(circle, transparent 62%, #000 63%);
      }

      .orb-core {
        position: absolute;
        width: 128px;
        height: 128px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 38%, #ffffff 0%, #f3f6ff 55%, #e8edff 100%);
        border: 1px solid rgba(77, 107, 254, 0.16);
        box-shadow:
          inset 0 0 28px rgba(77, 107, 254, 0.06),
          0 8px 40px rgba(77, 107, 254, 0.16),
          0 2px 8px rgba(15, 23, 51, 0.06);
      }

      .logo {
        position: relative;
        width: 88px;
        height: 88px;
        z-index: 2;
        filter: drop-shadow(0 4px 16px rgba(77, 107, 254, 0.28));
      }

      .logo svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* soft reflection under the floating logo */
      .shadow {
        width: 130px;
        height: 16px;
        margin-top: -1.4rem;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, rgba(77, 107, 254, 0.18) 0%, transparent 70%);
        filter: blur(8px);
        animation: shadow-pulse 3.6s ease-in-out infinite;
      }

      @keyframes shadow-pulse {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(0.82); }
      }

      /* ---------- status text ---------- */

      .status h1 {
        margin: 0 0 0.65rem;
        font-size: clamp(1.35rem, 2.2vw, 1.7rem);
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--ink);
        text-shadow: 0 0 20px rgba(77, 107, 254, 0.14);
      }

      .status p {
        margin: 0;
        font-size: 0.92rem;
        line-height: 1.6;
        color: var(--ink-dim);
        white-space: pre-line;
        font-family: var(--mono);
        letter-spacing: 0.01em;
        min-height: 1.6em;
      }

      /* ---------- progress ---------- */

      .progress {
        width: min(320px, 76vw);
        height: 3px;
        border-radius: 999px;
        background: rgba(77, 107, 254, 0.12);
        overflow: hidden;
        position: relative;
      }

      .progress .bar {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 42%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, var(--brand) 30%, var(--brand-2) 70%, transparent);
        box-shadow: 0 0 10px rgba(77, 107, 254, 0.4);
        animation: slide 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes slide {
        0% { left: -45%; }
        100% { left: 110%; }
      }

      /* ---------- brand ---------- */

      .brand {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }

      .brand svg {
        width: 16px;
        height: 16px;
      }

      .brand .tag {
        padding: 0.14rem 0.5rem;
        border: 1px solid rgba(77, 107, 254, 0.18);
        border-radius: 999px;
        font-family: var(--mono);
        font-size: 0.62rem;
        letter-spacing: 0.2em;
        color: var(--brand);
        background: rgba(77, 107, 254, 0.06);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
