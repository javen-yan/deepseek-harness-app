[package]
name = "deepseek-harness-app"
version = "0.1.0-rc.1"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.3.0", features = [] }

[dependencies]
tauri = { version = "=2.6.0", features = ["image-png", "tray-icon"] }
tauri-plugin-dialog = "=2.2.2"
tauri-plugin-updater = "=2.7.0"
tauri-runtime = "=2.7.0"
tauri-runtime-wry = "=2.7.0"
tauri-utils = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
